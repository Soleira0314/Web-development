<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #f0f4f8;
        color: #1a2b3c;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        width: 80vw;
        max-width: 620px;
        text-align: center;
      }

      h2 {
        font-size: 2.5rem;
        text-transform: capitalize;
      }

      .underline {
        width: 80px;
        height: 4px;
        background: #4aa3e8;
        margin: 0.75rem auto 3rem;
      }

      .review {
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 4px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: box-shadow 0.3s;
      }

      .review:hover {
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .img-container {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 1.5rem;
      }

      .img-container::before {
        content: "";
        position: absolute;
        top: -4px;
        right: -8px;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #4aa3e8;
      }

      #person-img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      #job {
        margin: 0.25rem 0 0.5rem;
        color: #4aa3e8;
        font-size: 0.85rem;
        text-transform: uppercase;
      }

      #info {
        margin-bottom: 1rem;
        color: #6b829a;
      }

      button {
        cursor: pointer;
      }

      .arrow {
        background: none;
        border: none;
        color: #8ac4f0;
        font-size: 2rem;
        margin: 0 0.5rem;
      }

      .arrow:hover {
        color: #4aa3e8;
      }

      #random {
        margin-top: 0.5rem;
        padding: 0.25rem 0.5rem;
        background: #eef7ff;
        color: #4aa3e8;
        border: 1px solid #4aa3e8;
        border-radius: 4px;
        text-transform: capitalize;
      }

      #random:hover {
        background: #4aa3e8;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <section class="container">
      <h2>our reviews</h2>
      <div class="underline"></div>

      <article class="review">
        <div class="img-container">
          <img id="person-img" src="person-1.jpeg" alt="" />
        </div>
        <h4 id="author"></h4>
        <p id="job"></p>
        <p id="info"></p>

        <button id="prev" class="arrow">&lsaquo;</button>
        <button id="next" class="arrow">&rsaquo;</button>
        <br />
        <button id="random">surprise me</button>
      </article>
    </section>

    <script src="app.js"></script>
  </body>
</html>
